name: Model and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.5'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m tools.boat_analysis.cli install
      - run: uv run python -m tools.boat_analysis.environment.climatology
      - run: uv run python -m tools.boat_analysis.environment.sensitivity
      - run: uv run python -m tools.publishing.passage_exposure
      - name: Check passage-exposure plot matches the native model
        run: git diff --exit-code -- docs/figures/passage-reliability.svg
      - name: Check committed weather views match their model and evidence
        run: git diff --exit-code -- models/evidence/gorge-wind.sysml docs/figures/gorge-wind-seasons.svg docs/figures/weather-performance-sensitivity.svg
      - run: uv run python -m tools.boat_analysis.cli prepare
      - run: uv run python -m tools.boat_analysis.cli evidence-check
      - run: uv run pytest -q
      - run: uv run python -m tools.publishing.build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated model views
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
