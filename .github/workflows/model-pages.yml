name: Model and documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          enable-cache: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: false
      - run: python3 tools/boat_analysis/model/install.py
      - run: uv sync --locked
      - name: Select the pinned compiler
        run: python3 -c 'from tools.boat_analysis.model.install import binary_path; print("OPENSYSML_BINARY=" + str(binary_path()))' >> "$GITHUB_ENV"
      - run: uv run python -m tools.boat_analysis.environment.climatology
      - run: uv run python -m tools.boat_analysis.environment.sensitivity
      - run: uv run python -m tools.publishing.passage_exposure
      - name: Check passage-exposure plot matches the native model
        run: git diff --exit-code -- docs/figures/passage-reliability.svg
      - name: Check committed weather views match their model and evidence
        run: git diff --exit-code -- models/evidence/gorge-wind.sysml docs/figures/gorge-wind-seasons.svg docs/figures/weather-performance-sensitivity.svg
      - run: uv run python -m tools.publishing.frontier --run 2026-10-13-srr-frontier
      - name: Check SRR sizing views match archived evidence
        run: git diff --exit-code -- models/evidence/srr-frontier.sysml docs/figures/srr-frontier.svg
      - run: uv run python -m tools.publishing.srr --run 2026-10-13-srr-readiness
      - name: Check current SRR candidate matches replay evidence
        run: git diff --exit-code -- models/evidence/srr-current.sysml
      - run: uv run python -m tools.boat_analysis.cli prepare
      - run: uv run python -m tools.boat_analysis.cli evidence-check
      - name: Check reusable SysML Python interface
        run: uv run pytest packages/sysml-python/tests -q
      - name: Verify installed runtime with an independent project
        run: |
          uv build packages/sysml-python --wheel --out-dir .tools/runtime-dist
          template_dir=$(mktemp -d)
          cp examples/thermal/pyproject.toml "$template_dir/"
          cp -R examples/thermal/models examples/thermal/tests "$template_dir/"
          uv venv "$template_dir/.venv" --python 3.12
          uv pip install --python "$template_dir/.venv/bin/python" .tools/runtime-dist/*.whl 'pytest>=9,<10'
          cd "$template_dir"
          .venv/bin/python -m pytest -q
      - run: uv run pytest -q
      - name: Exercise the seeded mission campaign
        run: uv run python -m tools.boat_analysis.mission.campaign --count 4
      - run: uv run python -m tools.publishing.sizing_progress
      - name: Check sizing plot matches archived evidence
        run: git diff --exit-code -- docs/figures/finite-passage-sizing.svg
      - run: uv run python -m tools.publishing.course_map
      - name: Check course map matches the model and chart evidence
        run: git diff --exit-code -- docs/figures/gorge-course-map.svg
      - run: uv run python -m tools.publishing.wave_motion evidence/runs/2026-10-13-wave-motion
      - run: uv run python -m tools.publishing.wave_performance evidence/runs/2026-10-13-wave-performance
      - run: uv run python -m tools.publishing.build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated model views
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
