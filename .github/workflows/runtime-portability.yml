name: Runtime portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            python: .venv/bin/python
            shell: bash
            generated: true
          - os: macos-14
            compiler: clang
            python: .venv/bin/python
            shell: bash
            generated: true
          - os: windows-2022
            compiler: gcc
            python: .venv/Scripts/python.exe
            shell: pwsh
            generated: true
          - os: windows-2022
            compiler: cl
            python: .venv/Scripts/python.exe
            shell: pwsh
            generated: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CC: ${{ matrix.compiler }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.10'
      - name: Install MinGW GCC
        id: mingw
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
      - name: Expose MinGW to native Python
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value '${{ steps.mingw.outputs.msys2-location }}/mingw64/bin'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CC=${{ steps.mingw.outputs.msys2-location }}/mingw64/bin/gcc.exe'
      - name: Inspect selected Windows GNU toolchain
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        shell: pwsh
        run: |
          & $env:CC --version
          $linker = & $env:CC -print-prog-name=ld
          & $linker --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected MinGW linker is unavailable' }
      - run: uv venv --python 3.12
      - run: uv pip install -e packages/sysml-python 'pytest>=9,<10'
      - name: Native ABI and build cache tests
        run: ${{ matrix.python }} -m pytest packages/sysml-python/tests/test_native.py -q
      - name: Install pinned OpenSysML
        if: matrix.generated
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache: false
      - name: Build pinned OpenSysML
        if: matrix.generated
        run: ${{ matrix.python }} -m tools.boat_analysis.model.install
      - name: Generated model execution
        if: matrix.generated
        run: >-
          ${{ matrix.python }} -c "import os, subprocess, sys;
          from tools.boat_analysis.model.install import binary_path;
          subprocess.run(['uv', 'pip', 'install', str(binary_path().parent / 'source/client/python')], check=True);
          env = dict(os.environ, OPENSYSML_BINARY=str(binary_path()));
          subprocess.run([sys.executable, '-m', 'pytest', 'packages/sysml-python/tests/test_project.py', '-q'], env=env, check=True)"
