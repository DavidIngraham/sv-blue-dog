[project]
name = "sv-blue-dog-modeling"
version = "0.1.0"
description = "SysML v2 model validation and documentation generation for SV Blue Dog"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opensysml==0.9.2",
    "sysml-python-runtime",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "capytaine==3.0.0",
    "markdown-it-py>=4,<5",
    "matplotlib>=3.10,<4",
    "pytest>=9.1.1",
    "scipy>=1.17,<2",
    "shapely>=2.1,<3",
    "trimesh>=4.7,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.sysml_python]
models = ["models/**/*.sysml"]
generated_package = "tools.boat_analysis.generated"
backend = "opensysml-c"

[tool.sysml_python.exports.mass]
definition = "MarineMass::MassProperties"
checks = "MarineMass::InputChecks"
output_record = "MarineDesign::MassProperties"

[tool.sysml_python.exports.mass.aliases]
d = "design"
p = "parameters"
m = "materials"

[tool.sysml_python.exports.mass.records]
design = "MarineDesign::Design"
parameters = "MarineDesign::Parameters"

[tool.sysml_python.exports.mass.defaults]
parameters = "BlueDogCoupledSizing::Inputs.parameterValues"
materials = "BlueDogCoupledSizing::Inputs.materialValues"

[tool.uv.sources]
sysml-python-runtime = { path = "packages/sysml-python", editable = true }

[tool.sysml_python.exports.structure]
definition = "MarineStructures::DesignMargins"
[tool.sysml_python.exports.structure.aliases]
d = "design"
p = "parameters"
m = "mass"
g = "geometry"
r = "structure"
[tool.sysml_python.exports.structure.records]
design = "MarineDesign::Design"
parameters = "MarineDesign::Parameters"
mass = "MarineDesign::MassProperties"
loads = "MarineDesign::AppendageLoads"
[tool.sysml_python.exports.structure.defaults]
structure = "BlueDogCoupledOperation::Inputs.structureValues"

[tool.sysml_python.exports.concept]
definition = "MarineConcept::Evaluate"
[tool.sysml_python.exports.concept.aliases]
d = "design"
m = "mass"
g = "geometry"
q = "environment"
voyage = "passage"
[tool.sysml_python.exports.concept.records]
design = "MarineDesign::Design"
mass = "MarineDesign::MassProperties"
passage = "MarineDesign::Passage"
[tool.sysml_python.exports.concept.defaults]
environment = "BlueDogOperatingEnvironment::Inputs.parameterValues"
policy = "BlueDogConceptCredibility::Inputs.values"
