[project]
name = "sv-blue-dog-modeling"
version = "0.1.0"
description = "SysML v2 model validation and documentation generation for SV Blue Dog"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opensysml==0.9.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
