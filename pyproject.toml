[project]
name = "sv-blue-dog-modeling"
version = "0.1.0"
description = "SysML v2 model validation and documentation generation for SV Blue Dog"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opensysml",
    "sysml-python-runtime",
    "pydantic>=2.14,<3",
    "PyYAML>=6.0.2,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "capytaine==3.0.0",
    "markdown-it-py>=4,<5",
    "matplotlib>=3.10,<4",
    "pytest>=9.1.1",
    "scipy>=1.17,<2",
    "shapely>=2.1,<3",
    "trimesh>=4.7,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/inland-navigation/test_navigation.py"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.sysml_python]
models = ["models/**/*.sysml"]
generated_package = "tools.boat_analysis.generated"
backend = "opensysml-c"

[tool.sysml_python.exports.mass]
definition = "Analysis::Mechanics::Mass::MassProperties"
checks = "Analysis::Mechanics::Mass::InputChecks"
output_record = "MarineDesign::MassProperties"

[tool.sysml_python.exports.mass.aliases]
d = "design"
p = "parameters"
m = "materials"

[tool.sysml_python.exports.mass.records]
design = "MarineDesign::Design"
parameters = "MarineDesign::Parameters"

[tool.sysml_python.exports.mass.defaults]
parameters = "BlueDog::Analyses::Sizing::Inputs.parameterValues"
materials = "BlueDog::Analyses::Sizing::Inputs.materialValues"

[tool.uv.sources]
opensysml = { path = ".tools/develop-23ca2e2f0/source/client/python" }
sysml-python-runtime = { path = "packages/sysml-python", editable = true }

[tool.sysml_python.exports.structure]
definition = "Analysis::Mechanics::Structures::DesignMargins"
[tool.sysml_python.exports.structure.aliases]
d = "design"
p = "parameters"
m = "mass"
g = "geometry"
r = "structure"
[tool.sysml_python.exports.structure.records]
design = "MarineDesign::Design"
parameters = "MarineDesign::Parameters"
mass = "MarineDesign::MassProperties"
loads = "MarineDesign::AppendageLoads"
[tool.sysml_python.exports.structure.defaults]
structure = "BlueDog::Analyses::Operating::Inputs.structureValues"

[tool.sysml_python.exports.concept]
definition = "Analysis::Marine::Concept::Evaluate"
[tool.sysml_python.exports.concept.aliases]
d = "design"
m = "mass"
g = "geometry"
q = "environment"
voyage = "passage"
[tool.sysml_python.exports.concept.records]
design = "MarineDesign::Design"
mass = "MarineDesign::MassProperties"
passage = "MarineDesign::Passage"
[tool.sysml_python.exports.concept.defaults]
environment = "BlueDog::Configurations::OperatingEnvironment::Inputs.parameterValues"
policy = "BlueDog::Analyses::Sizing::Credibility::Inputs.values"

[tool.sysml_python.exports.operation]
definition = "Analysis::Marine::Sailing::Evaluate"
output_definition = "Analysis::Marine::Sailing::Core"
checks = "Analysis::Marine::Sailing::InputChecks"
[tool.sysml_python.exports.operation.aliases]
d = "design"
p = "parameters"
q = "environment"
s = "state"
massData = "mass"
[tool.sysml_python.exports.operation.records]
design = "MarineDesign::Design"
parameters = "MarineDesign::Parameters"
state = "MarineDesign::OperatingState"
aero = "MarineDesign::AeroCoefficients"
mass = "MarineDesign::MassProperties"
hydro = "MarineDesign::HydroState"
[tool.sysml_python.exports.operation.defaults]
environment = "BlueDog::Configurations::OperatingEnvironment::Inputs.parameterValues"

[tool.sysml_python.exports.route]
definition = "Analysis::Marine::Course::Route"
[tool.sysml_python.exports.route.defaults]
policy = "BlueDog::Analyses::Operating::Inputs.routeParameters"

[tool.sysml_python.exports.wind_sample]
definition = "Analysis::Marine::Surface::WindSample"

[tool.sysml_python.exports.strip_load]
definition = "Analysis::Marine::Surface::StripLoad"

[tool.sysml_python.exports.fetch_sea]
definition = "Analysis::Marine::Surface::FetchSea"

[tool.sysml_python.exports.speed_retention]
definition = "Analysis::Marine::Surface::SpeedRetention"

[tool.sysml_python.exports.wave_screen]
definition = "Analysis::Marine::Surface::WaveScreen"

[tool.sysml_python.exports.harmonic_response]
definition = "Analysis::Marine::Surface::HarmonicResponse"

[tool.sysml_python.exports.orbital_velocity]
definition = "Analysis::Marine::WavePerformance::OrbitalVelocity"

[tool.sysml_python.exports.foil_load]
definition = "Analysis::Marine::WavePerformance::FoilLoad"

[tool.sysml_python.exports.impedance_term]
definition = "Analysis::Marine::WavePerformance::ImpedanceTerm"

[tool.sysml_python.exports.balance_correction]
definition = "Analysis::Marine::WavePerformance::BalanceCorrection"

[tool.sysml_python.exports.wave_actuation]
definition = "Analysis::Marine::WavePerformance::Actuation"

[tool.sysml_python.exports.recovery_segment]
definition = "Analysis::Marine::Recovery::Segment"
[tool.sysml_python.exports.wave_actuation.defaults]
q = "BlueDog::Configurations::OperatingEnvironment::Inputs.parameterValues"

[tool.sysml_python.exports.sailing_core]
definition = "Analysis::Marine::Sailing::Core"
checks = "Analysis::Marine::Sailing::InputChecks"
[tool.sysml_python.exports.sailing_core.defaults]
q = "BlueDog::Configurations::OperatingEnvironment::Inputs.parameterValues"
[tool.sysml_python.exports.sailing_core.records]
d = "MarineDesign::Design"
p = "MarineDesign::Parameters"
s = "MarineDesign::OperatingState"
aero = "MarineDesign::AeroCoefficients"
massData = "MarineDesign::MassProperties"
hydro = "MarineDesign::HydroState"

[tool.sysml_python.exports.hull_resistance]
definition = "Analysis::Marine::Resistance::Evaluate"
checks = "Analysis::Marine::Resistance::InputChecks"
[tool.sysml_python.exports.hull_resistance.aliases]
h = "hull"

[tool.sysml_python.exports.wet_moment]
definition = "Analysis::Marine::Hydrostatics::WetMoment"
[tool.sysml_python.exports.wet_moment.aliases]
p = "vertices"

[tool.sysml_python.exports.hydrostatic_balance]
definition = "Analysis::Marine::Hydrostatics::Balance"
checks = "Analysis::Marine::Hydrostatics::BalanceChecks"
[tool.sysml_python.exports.hydrostatic_balance.aliases]
centerOfGravity = "cg"
massKg = "mass"
densityKgM3 = "density"
