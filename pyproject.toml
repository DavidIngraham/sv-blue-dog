[project]
name = "sv-blue-dog-modeling"
version = "0.1.0"
description = "SysML v2 model validation and documentation generation for SV Blue Dog"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opensysml==0.9.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "capytaine==3.0.0",
    "markdown-it-py>=4,<5",
    "matplotlib>=3.10,<4",
    "pytest>=9.1.1",
    "scipy>=1.17,<2",
    "shapely>=2.1,<3",
    "trimesh>=4.7,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
