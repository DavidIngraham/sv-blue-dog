<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 570" role="img" aria-labelledby="title desc">
<title id="title">The Gorge challenge course</title>
<desc id="desc">North-up map of the Columbia River between Stevenson and Bingen, passing Hood River. The challenge begins at Bingen, heads downstream toward Stevenson, and returns upstream. Washington lies north of the river and Oregon south.</desc>
<rect width="1140" height="570" fill="#f5f8fa"/>
<defs><marker id="out" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ab4e23"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#176a65"/></marker></defs>
<g font-family="system-ui, sans-serif" fill="#183047">
