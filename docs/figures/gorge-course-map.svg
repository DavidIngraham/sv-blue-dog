<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 570" role="img" aria-labelledby="title desc">
<title id="title">The Gorge challenge course</title>
<desc id="desc">North-up map of the Columbia River between Bonneville and The Dalles, passing Cascade Locks, Hood River and Mosier. The challenge begins at The Dalles, heads downstream toward Bonneville, and returns upstream. Washington lies north of the river and Oregon south.</desc>
