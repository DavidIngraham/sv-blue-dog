config:

%% layout: n0 x=300 y=0

%% layout: n3 x=600 y=220

**Configuration**`&#34;]

**Sail**`&#34;]

  n0 ---|&#34;◆ keel&#34;| n2
  n0 ---|&#34;◆ rudder&#34;| n3
  n3 --&gt;|&#34;specialization&#34;| n2</pre>
