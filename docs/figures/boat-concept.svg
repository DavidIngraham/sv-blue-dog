<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="title desc"><title id="title">The boat I am trying to bring together</title><desc id="desc">Illustrative side view, not CAD or an optimized geometry. A wing sits above a hull with solar collection and electronics. A rudder steers, a keel resists sideways motion, and ballast supplies restoring moment. Recovery propulsion remains an installation trade.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#276484"/></marker></defs><rect width="800" height="490" fill="#f5f8fa"/><g font-family="system-ui, sans-serif" fill="#183047"><text x="24" y="34" font-size="24">The boat I am trying to bring together</text><path d="M130 265 L650 265 L590 305 L210 305 Z" fill="none" stroke="#276484" stroke-width="3"/><path d="M350 262 L350 65 L440 240 L350 240" fill="none" stroke="#276484" stroke-width="3"/><path d="M400 305 L400 355 L445 355 L430 305" fill="none" stroke="#276484" stroke-width="3"/><path d="M620 280 L620 335 L600 335 L600 300" fill="none" stroke="#276484" stroke-width="3"/><ellipse cx="422" cy="365" rx="48" ry="13" fill="#276484"/><text x="460" y="110" font-size="19">Wing: drive and trim</text><path d="M455 115 L392 145" fill="none" stroke="#276484" stroke-width="3"/><text x="30" y="200" font-size="19">Solar collection</text><path d="M165 205 L245 261" fill="none" stroke="#276484" stroke-width="3"/><text x="490" y="220" font-size="19">Electronics / storage</text><path d="M595 225 L520 282" fill="none" stroke="#276484" stroke-width="3"/><text x="652" y="325" font-size="17">Rudder</text><text x="460" y="349" font-size="17">Keel + ballast</text><text x="24" y="435" font-size="18">Recovery propulsor: water or air installation still under comparison</text><text x="24" y="465" font-size="16">Concept sketch only · locations and proportions are illustrative</text></g></svg>