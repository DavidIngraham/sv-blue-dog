<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Ingress changes the recovery problem</title><desc id="desc">Three wing sections show sealed air, free flooding and retained water. Each state changes buoyancy or carried mass. Roll restoring moment and pitch stability are distinct checks, and static samples do not demonstrate a dynamic return upright.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#276484"/></marker></defs><rect width="800" height="420" fill="#f5f8fa"/><g font-family="system-ui, sans-serif" fill="#183047"><text x="24" y="34" font-size="24">Ingress changes the recovery problem</text><rect x="25" y="95" width="235" height="150" rx="8" fill="#e8f2f7" stroke="#276484"/><text x="37" y="125" font-size="19">Sealed</text><text x="45" y="163" font-size="17">Air volume retained</text><rect x="280" y="95" width="235" height="150" rx="8" fill="#e8f2f7" stroke="#276484"/><text x="292" y="125" font-size="19">Freely flooded</text><text x="298" y="163" font-size="17">Water moves in / out</text><rect x="535" y="95" width="235" height="150" rx="8" fill="#e8f2f7" stroke="#276484"/><text x="547" y="125" font-size="19">Water retained</text><text x="552" y="163" font-size="17">Trapped mass carried</text><path d="M300 210 L485 210" fill="none" stroke="#276484" stroke-width="3" marker-end="url(#arrow)"/><rect x="554" y="190" width="195" height="35" fill="#afcfdf"/><text x="30" y="300" font-size="19">Roll: does it tend to come upright sideways?</text><text x="30" y="339" font-size="19">Pitch: is the bow–stern equilibrium stable?</text><text x="30" y="390" font-size="18">Both matter. A positive roll sample alone does not prove self-righting.</text></g></svg>