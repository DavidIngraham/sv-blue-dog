<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Columbia River Gorge: out and back</title><desc id="desc">Schematic, not a map or navigation chart. Bonneville is west of The Dalles. Start at The Dalles, travel downstream toward Bonneville, then return upstream. Current runs toward Bonneville. The representative westerly blows toward The Dalles: outbound windward with current, return leeward against current. An easterly reverses the sailing directions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#276484"/></marker></defs><rect width="800" height="420" fill="#f5f8fa"/><g font-family="system-ui, sans-serif" fill="#183047"><text x="24" y="34" font-size="24">Columbia River Gorge: out and back</text><text x="24" y="68" font-size="19">West / downstream</text><text x="570" y="68" font-size="19">East / upstream</text><rect x="30" y="130" width="170" height="55" rx="8" fill="#e8f2f7" stroke="#276484"/><text x="42" y="160" font-size="19">Bonneville</text><rect x="575" y="130" width="190" height="55" rx="8" fill="#e8f2f7" stroke="#276484"/><text x="587" y="160" font-size="19">The Dalles</text><path d="M565 125 L220 125" fill="none" stroke="#276484" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="105" font-size="19">1. Outbound</text><path d="M220 205 L565 205" fill="none" stroke="#276484" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="235" font-size="19">2. Return</text><path d="M560 295 L230 295" fill="none" stroke="#276484" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="280" font-size="19">River current</text><path d="M230 355 L560 355" fill="none" stroke="#276484" stroke-width="3" marker-end="url(#arrow)"/><text x="270" y="340" font-size="19">Westerly: representative case</text><text x="24" y="402" font-size="16">Oregonâ€“Washington Â· not to scale Â· not a navigation chart</text></g></svg>