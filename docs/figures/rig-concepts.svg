<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Three ways to control the sail</title><desc id="desc">Conceptual rig sketches, not evaluated geometry. Left: wing with tail and elevator controlling its trim. Center: fixed-camber wing rotated at its mast by a drive. Right: triangular soft sail trimmed by a sheet.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#276484"/></marker></defs><rect width="800" height="420" fill="#f5f8fa"/><g font-family="system-ui, sans-serif" fill="#183047"><text x="24" y="34" font-size="24">Three ways to control the sail</text><path d="M105 235 L105 80 L150 85 L150 235 Z" fill="none" stroke="#276484" stroke-width="3"/><path d="M145 200 L215 200 L215 140 L235 140 L235 200" fill="none" stroke="#276484" stroke-width="3"/><text x="30" y="280" font-size="18">Tail-controlled wing</text><text x="30" y="312" font-size="16">Elevator adjusts trim</text><path d="M365 235 L365 80 L405 80 L405 235 Z" fill="none" stroke="#276484" stroke-width="3"/><path d="M345 252 Q380 285 425 250" fill="none" stroke="#276484" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 350 Q375 315 430 350 Q375 330 320 350" fill="#afcfdf" stroke="#276484"/><text x="300" y="373" font-size="14">Section inset: fixed camber</text><text x="290" y="312" font-size="16">Drive rotates the mast</text><text x="300" y="280" font-size="18">Fixed-camber wing</text><path d="M620 240 L620 70 L750 240 Z" fill="none" stroke="#276484" stroke-width="3"/><path d="M725 240 L660 270" fill="none" stroke="#276484" stroke-width="3"/><text x="570" y="280" font-size="18">Triangular soft sail</text><text x="570" y="312" font-size="16">Sheet controls trim</text><text x="24" y="408" font-size="17">Compare installed drive, energy, durability, handling and recovery—not lift alone</text></g></svg>