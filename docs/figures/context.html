<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission context</title>
<link rel="stylesheet" href="sysml-document.css">
</head>
<body>
<article class="sysml-document" data-document="BlueDogDiagramDocuments::ContextDiagram">
<h1 class="sysml-title">Mission context</h1>
<figure class="sysml-diagram" data-content="diagram" data-name="diagram" data-view="BlueDogArchitectureViews::context" data-diagram-kind="interconnection" data-direction="TB">
<pre class="mermaid">---
config:
  fontFamily: &#34;Helvetica, Arial, sans-serif&#34;
  theme: base
  themeCSS: &#34;.edgeLabel rect { opacity: 1 !important; } .cluster-label .nodeLabel { text-align: center; }&#34;
  themeVariables:
    fontFamily: &#34;Helvetica, Arial, sans-serif&#34;
    fontSize: &#34;14px&#34;
    primaryColor: &#34;#FFFFFF&#34;
    secondaryColor: &#34;#FFFFFF&#34;
    tertiaryColor: &#34;#FFFFFF&#34;
    background: &#34;#FFFFFF&#34;
    primaryBorderColor: &#34;#181818&#34;
    primaryTextColor: &#34;#000000&#34;
    lineColor: &#34;#181818&#34;
    textColor: &#34;#000000&#34;
    noteBkgColor: &#34;#FEFFDD&#34;
    noteBorderColor: &#34;#181818&#34;
    noteTextColor: &#34;#000000&#34;
    clusterBkg: &#34;#FFFFFF&#34;
    clusterBorder: &#34;#181818&#34;
    edgeLabelBackground: &#34;#FFFFFF&#34;
---
%% BlueDogArchitectureViews::context — interconnection rendering (render Views::asInterconnectionDiagram)
flowchart TB
  subgraph n0 [&#34;`*«part»* **missionContext**`&#34;]
    direction TB
    n1(&#34;`*«part»*
**boat : Boat**`&#34;)
    n2(&#34;`*«part»*
**operator : Operator**`&#34;)
    n3(&#34;`*«part»*
**shoreSupport : ShoreSupport**`&#34;)
    n4(&#34;`*«part»*
**environment : Environment**`&#34;)
    n5(&#34;`*«part»*
**traffic : OtherVessel**`&#34;)
  end</pre>
</figure>
</article>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.min.js"></script>
<script>mermaid.initialize({maxTextSize: 1112, maxEdges: 1});</script>
</body>
</html>
